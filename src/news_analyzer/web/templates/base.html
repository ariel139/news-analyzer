<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}מנתח חדשות{% endblock %}</title>
  <meta name="description" content="כותרות מכלי התקשורת בישראל, לצד ניתוח אוטומטי של המסגור הפוליטי בכל כתבה.">
  <script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317191d'/%3E%3Cpath d='M8 20h16M10 14h12' stroke='%23f7f5f0' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='20' r='3' fill='%23c47a1c'/%3E%3C/svg%3E">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/theme.js" defer></script>
  <script src="/static/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15h16M6 9h12"/><circle cx="14" cy="15" r="2.4" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="brand-name">מנתח חדשות</span>
        <span class="poc">ניסוי</span>
      </a>
      <div class="header-actions">
        {% set page = request.url.path %}
        <nav aria-label="ניווט ראשי">
          <a href="/" {% if page == '/' %}aria-current="page"{% endif %}>עדכונים</a>
          <a href="/methodology" {% if page == '/methodology' %}aria-current="page"{% endif %}>איך זה עובד</a>
        </nav>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="מעבר למצב כהה" aria-pressed="false">
          <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="wrap">
      <span>אב־טיפוס ניסיוני · מציג כותרות וקישורים בלבד, לא את תוכן הכתבות</span>
      <span><a href="/methodology">מתודולוגיה ומגבלות</a> · <a href="/api/docs">API</a></span>
    </div>
  </footer>
</body>
</html>
