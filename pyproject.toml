[project]
name = "news-analyzer"
version = "0.1.0"
description = "POC: Hebrew aggregator of Israeli news with local-LLM political-leaning analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.110",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "protego>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
    "tzdata",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
news-analyzer = "news_analyzer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_analyzer = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
